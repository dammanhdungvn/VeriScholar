;; ==============================================================================
;; VeriScholar Production PgBouncer Configuration
;; Target Capacity: 3,000 - 100,000 Concurrent Academic Researchers
;; Mode: Transaction Pooling (Stateless Connection Virtualization)
;; ==============================================================================

[databases]
;; Direct connection to primary PostgreSQL cluster
verischolar = host=127.0.0.1 port=5432 dbname=verischolar auth_user=postgres

[pgbouncer]
;; -----------------------------------------------------------------------------
;; Administrative & Network Settings
;; -----------------------------------------------------------------------------
logfile = /var/log/postgresql/pgbouncer.log
pidfile = /var/run/postgresql/pgbouncer.pid
listen_addr = 127.0.0.1
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres, verischolar_admin
stats_users = verischolar_monitor

;; -----------------------------------------------------------------------------
;; Connection Pooling Strategy
;; -----------------------------------------------------------------------------
;; Transaction pooling mode decouples client sessions from server processes.
;; 3,000 - 10,000 client sockets are multiplexed onto ~50 real PostgreSQL workers.
pool_mode = transaction

;; Maximum incoming client connections permitted across all tenants
max_client_conn = 5000

;; Default active connections per database-user pair to backend PostgreSQL
default_pool_size = 50

;; Minimum pre-warmed connections maintained to minimize cold connection latency
min_pool_size = 10

;; Emergency reserve pool dynamically allocated during sudden traffic spikes
reserve_pool_size = 15
reserve_pool_timeout = 3.0

;; Hard ceiling of concurrent backend connections to PostgreSQL cluster
max_db_connections = 120

;; -----------------------------------------------------------------------------
;; Timeouts & Connection Hygiene
;; -----------------------------------------------------------------------------
;; Max time a client query can wait in queue before receiving an error (seconds)
query_wait_timeout = 30.0

;; Idle timeout before reclaiming inactive backend connections
server_idle_timeout = 300.0

;; Max lifetime of a backend server connection to prevent memory bloat
server_lifetime = 3600.0

;; Reset server connection state cleanly between multiplexed transactions
server_reset_query = DISCARD ALL
server_check_query = SELECT 1
server_check_delay = 30.0

;; Socket buffer optimizations for high-throughput academic payloads
pkt_buf = 4096
max_packet_size = 2147483648
tcp_keepalive = 1
tcp_keepidle = 30
tcp_keepintvl = 10
tcp_keepcnt = 3
