# ==============================================================================
# VeriScholar Enterprise On-Premise Production Stack (Pillar 5)
# Scalable Multi-Tenant Architecture (3,000 -> 100,000 Concurrent Academic Users)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. High-Density Database (PostgreSQL 16 + pgvector)
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    container_name: verischolar-enterprise-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-verischolar}
      POSTGRES_USER: ${POSTGRES_USER:-verischolar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-verischolar_secure_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-verischolar} -d ${POSTGRES_DB:-verischolar}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - verischolar_internal

  # ----------------------------------------------------------------------------
  # 2. Transaction Connection Pooler (PgBouncer)
  # Multiplexes 5,000+ client connections down to 50-120 backend DB connections
  # ----------------------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:v1.22.1
    container_name: verischolar-enterprise-pgbouncer
    restart: unless-stopped
    environment:
      DB_USER: ${POSTGRES_USER:-verischolar}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-verischolar_secure_pass}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-verischolar}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 5000
      DEFAULT_POOL_SIZE: 100
      MIN_POOL_SIZE: 20
      RESERVE_POOL_SIZE: 15
      MAX_DB_CONNECTIONS: 120
      SERVER_IDLE_TIMEOUT: 600
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - verischolar_internal

  # ----------------------------------------------------------------------------
  # 3. Distributed Cache & Task Message Broker (Redis 7)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: verischolar-enterprise-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - verischolar_internal

  # ----------------------------------------------------------------------------
  # 4. Core Application API Cluster (FastAPI + Uvicorn AsyncIO)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ../
      dockerfile: deploy/Dockerfile.api
    container_name: verischolar-enterprise-api
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-verischolar}:${POSTGRES_PASSWORD:-verischolar_secure_pass}@pgbouncer:6432/${POSTGRES_DB:-verischolar}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-verischolar_enterprise_jwt_super_secret_key_2026}
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      ARQ_REDIS_SETTINGS: redis://redis:6379/1
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - verischolar_internal

  # ----------------------------------------------------------------------------
  # 5. Distributed Background Worker (ARQ AsyncIO Worker)
  # Offloads heavy compute: PDF Parsing, OCR, DeBERTa NLI inference, LaTeX compile
  # ----------------------------------------------------------------------------
  arq-worker:
    build:
      context: ../
      dockerfile: deploy/Dockerfile.api
    container_name: verischolar-enterprise-arq-worker
    restart: unless-stopped
    command: arq api.workers.arq_worker.WorkerSettings
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-verischolar}:${POSTGRES_PASSWORD:-verischolar_secure_pass}@pgbouncer:6432/${POSTGRES_DB:-verischolar}
      REDIS_URL: redis://redis:6379/1
      JWT_SECRET: ${JWT_SECRET:-verischolar_enterprise_jwt_super_secret_key_2026}
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - verischolar_internal

  # ----------------------------------------------------------------------------
  # 6. High-Performance Web & Reverse Proxy Gateway (Nginx + React 19 SPA)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: ../
      dockerfile: deploy/Dockerfile.web
    container_name: verischolar-enterprise-web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      - api
    networks:
      - verischolar_internal

volumes:
  postgres_data:
    name: verischolar_enterprise_postgres_data
  redis_data:
    name: verischolar_enterprise_redis_data

networks:
  verischolar_internal:
    name: verischolar_enterprise_net
    driver: bridge
