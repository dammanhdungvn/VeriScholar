name: Continuous Integration (2-Tier Fast-Fail Quality Gates)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  security-scan:
    name: Tier 1 — Security & Secret Leak Detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks (Secret Detection)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-quality-gates:
    name: Tier 1 — Backend, DB & Harness Gates (Python / uv / pgvector / Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: verischolar
          POSTGRES_PASSWORD: verischolar
          POSTGRES_DB: verischolar
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U verischolar -d verischolar"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv package manager
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-suffix: "backend-uv"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies (Frozen Lockfile)
        run: |
          uv sync --all-packages --frozen

      - name: Run Gate 1 — Ruff Linter & Formatter Checks
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Install TeXLive & latexmk for CLSI LaTeX Compiler Tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-base texlive-binaries

      - name: Run Gate 2 — Pytest Suite (Boundary, Unit & Integration Tests)
        env:
          PYTHONPATH: apps/api/src:packages/core/src
          ENVIRONMENT: test
          OPENAI_API_KEY: sk-mock-ci-key-for-unit-tests
          DATABASE_URL: postgresql+asyncpg://verischolar:verischolar@127.0.0.1:5432/verischolar
          REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          uv run pytest -v --junitxml=test-results.xml

      - name: Upload Backend Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results.xml
          retention-days: 7

  frontend-quality-gates:
    name: Tier 1 — Frontend Quality Gates (TypeScript / React 19 / pnpm)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "apps/web/pnpm-lock.yaml"

      - name: Install frontend dependencies (Frozen Lockfile)
        run: |
          pnpm install --frozen-lockfile

      - name: Run Oxlint (Fast code linting)
        run: |
          pnpm lint

      - name: Run TypeScript type-checking
        run: |
          pnpm exec tsc -b

      - name: Run Gate 3 — Vitest Unit & Integration Test Suite
        run: |
          pnpm test:run --passWithNoTests --reporter=default --reporter=junit --outputFile=test-results.xml

      - name: Upload Frontend Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: apps/web/test-results.xml
          retention-days: 7

      - name: Run Gate 4 — Vite Production Build
        run: |
          pnpm build

  docker-validation:
    name: Tier 2 — Container & Deployment Script Validation (Gated)
    needs: [backend-quality-gates, frontend-quality-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Deployment Shell Scripts Syntax
        run: |
          bash -n scripts/deploy_production.sh scripts/deploy_web.sh scripts/dev/setup.sh scripts/dev/verify.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Build Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          push: false
          load: true
          tags: verischolar-api:ci-test
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Smoke Test Backend Docker Container
        run: |
          docker run --rm verischolar-api:ci-test uv run --no-dev python -c "import api; print('API module verified')"

      - name: Test Build Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          push: false
          tags: verischolar-web:ci-test
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
