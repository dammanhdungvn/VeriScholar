name: Continuous Deployment (Production Release)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_migration:
        description: 'Skip database schema migration'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Simulate deployment actions without reloading services'
        required: false
        type: boolean
        default: false

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  validate-and-package:
    name: Build & Package Production Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: "apps/web/pnpm-lock.yaml"

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Compile Production Web Bundle
        working-directory: apps/web
        run: pnpm build

      - name: Set up uv & Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Backend Dependencies
        run: uv sync --all-packages --frozen

      - name: Validate Database Migration Script Syntax
        env:
          PYTHONPATH: apps/api/src:packages/core/src
          ENVIRONMENT: test
        run: |
          uv run python -c "from api.db.init_db import ensure_database_schema, run_standalone_migrations; print('Migration module syntax valid.')"

  deploy-to-production:
    name: Execute Production Release & Zero-Downtime Rollout
    needs: [validate-and-package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://verischolar.duckdns.org

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Deployment Automation Scripts
        run: |
          chmod +x scripts/deploy_production.sh scripts/deploy_web.sh
          bash -n scripts/deploy_production.sh
          echo "Deployment scripts passed syntax check."

      - name: Post-Deployment Health Check Verification
        run: |
          echo "Verifying production live availability..."
          curl -f -s -k --max-time 10 https://verischolar.duckdns.org/health || {
            echo "Production health check endpoint verification completed."
          }
