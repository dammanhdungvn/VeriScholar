[project]
name = "api"
version = "0.1.0"
description = "FastAPI entrypoint and API controllers for VeriScholar"
readme = "README.md"
authors = [
    { name = "dammanhdungvn", email = "dammanhdungvn@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "core",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
    "rich>=15.0.0",
    "httpx>=0.28.1",
]

[project.scripts]
api = "api:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
