[project]
name = "api"
version = "0.1.0"
description = "FastAPI entrypoint and API controllers for VeriScholar"
readme = "README.md"
authors = [
    { name = "dammanhdungvn", email = "dammanhdungvn@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "core",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic-settings>=2.7.0",
    "structlog>=25.1.0",
    "rich>=13.9.0",
    "httpx>=0.28.1",
    "sqlalchemy[asyncio]>=2.0.38",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
]

[project.scripts]
api = "api:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
