<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <!-- Dynamic Favicon Setup based on Browser Tab Color Scheme -->
    <link id="favicon-svg" rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
    <link id="favicon-32" rel="icon" href="/favicon-32x32.png?v=2" type="image/png" sizes="32x32" />
    <link id="favicon-16" rel="icon" href="/favicon-16x16.png?v=2" type="image/png" sizes="16x16" />
    <link id="favicon-ico" rel="shortcut icon" href="/favicon.ico?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#181715" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FAF9F5" media="(prefers-color-scheme: light)" />
    <script>
      (function() {
        try {
          var isDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var m = isDark ? "dark" : "light";
          var head = document.head || document.getElementsByTagName("head")[0];
          [
            { id: "favicon-svg", rel: "icon", type: "image/svg+xml", href: "/favicon-" + m + ".svg?v=" + m },
            { id: "favicon-32", rel: "icon", type: "image/png", sizes: "32x32", href: "/favicon-" + m + "-32x32.png?v=" + m },
            { id: "favicon-16", rel: "icon", type: "image/png", sizes: "16x16", href: "/favicon-" + m + "-16x16.png?v=" + m },
            { id: "favicon-ico", rel: "shortcut icon", href: "/favicon-" + m + ".ico?v=" + m }
          ].forEach(function(item) {
            var old = document.getElementById(item.id);
            var el = document.createElement("link");
            el.id = item.id;
            el.setAttribute("rel", item.rel);
            if (item.type) el.setAttribute("type", item.type);
            if (item.sizes) el.setAttribute("sizes", item.sizes);
            el.setAttribute("href", item.href);
            if (old && old.parentNode) {
              old.parentNode.replaceChild(el, old);
            } else {
              head.appendChild(el);
            }
          });
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VeriScholar — Nền tảng Trợ lý AI Hỗ trợ Nghiên cứu và Soạn thảo Bài báo Khoa học. Triệt tiêu 100% ảo giác với Bounding Box trực quan." />
    <meta property="og:title" content="VeriScholar — Nền tảng AI Nghiên cứu & Soạn thảo Khoa học" />
    <meta property="og:description" content="Bảo chứng tọa độ nhị phân. Triệt tiêu 100% ảo giác học thuật theo chuẩn ISO 32000-1." />
    <meta property="og:image" content="/android-chrome-512x512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/android-chrome-512x512.png" />
    <title>VeriScholar — Nền tảng AI Nghiên cứu & Soạn thảo Khoa học</title>
    
    <!-- Preconnect Google Fonts for Academic Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap"
      rel="stylesheet"
    />
    <script>
      (function() {
        try {
          var t = localStorage.getItem("verischolar_theme");
          if (t === "dark" || (!t && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
            document.documentElement.setAttribute("data-theme", "dark");
            document.documentElement.style.colorScheme = "dark";
          } else {
            document.documentElement.classList.remove("dark");
            document.documentElement.setAttribute("data-theme", "light");
            document.documentElement.style.colorScheme = "light";
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-canvas text-ink antialiased selection:bg-primary/20 selection:text-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
