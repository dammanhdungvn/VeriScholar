[project]
name = "verischolar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []
description = "verischolar: open-source academic research & writing AI assistant"

[tool.uv.workspace]
members = [
    "packages/core",
    "apps/api",
]

[tool.uv.sources]
core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".agents",
    ".venv",
    "apps/web/node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
