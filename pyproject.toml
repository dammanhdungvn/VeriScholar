[project]
name = "verischolar"
version = "0.1.0"
description = "VeriScholar — AI-powered academic paper verification"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "structlog>=24.4.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
    "pypdf>=5.1.0",
    "python-dotenv>=1.0.0",
    "arq>=0.26.0",
    "pymupdf>=1.28.2",
    "tokenizers>=0.23.3",
    "onnxruntime>=1.31.0",
    "jinja2>=3.1.6",
    "rich>=13.9.0",
    "langfuse>=5.0.1",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
    "aiosqlite>=0.20.0",
]

[tool.uv.workspace]
members = ["apps/api", "packages/*"]

[tool.uv.sources]
core = { workspace = true }
api = { workspace = true }

[tool.setuptools]
packages = []

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    ".agents",
    "__pycache__",
    "build",
    "dist",
    "apps/web",
    "docs",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["E501", "E402"]
"apps/api/tests/**" = ["E501"]
"packages/core/tests/**" = ["E501"]
"apps/api/src/api/templates/**" = ["E501"]
"tests/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = [
    "apps/api/tests",
    "packages/core/tests",
    "tests/evals",
]
norecursedirs = [
    ".agents",
    ".venv",
    "apps/web",
    "scripts",
    "docs",
]
